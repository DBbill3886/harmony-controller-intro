<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HarmonyController · 把平板变成方向盘</title>
  <link rel="stylesheet" href="css/player.css" />
</head>
<body>
  <div id="stage-wrap">
    <canvas id="view" width="1080" height="1440" aria-label="影片画面"></canvas>
    <div class="hint" id="hint">
      <div class="card">
        <h1>HarmonyController</h1>
        <p>点击画面开始 · 3:4 · 可拖动进度 · 含旁白与字幕</p>
      </div>
    </div>
    <div id="bar">
      <input id="seek" type="range" min="0" max="102" step="0.01" value="0" />
      <div class="row">
        <button id="play" type="button">开始</button>
        <span id="time">00:00 / 01:42</span>
        <label>音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="1" /></label>
        <button id="subs" type="button" class="active">字幕开</button>
        <button id="lrc" type="button">导出 LRC</button>
        <button id="fs" type="button">全屏</button>
      </div>
    </div>
  </div>
  <audio id="voice" preload="auto" playsinline>
    <source src="audio/narration.m4a" type="audio/mp4" />
    <source src="audio/narration.wav" type="audio/wav" />
  </audio>
  <script src="js/cues.js"></script>
  <script src="js/render.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
